#!/usr/sbin/nft -f

flush ruleset

table inet soc_filter {
    chain input {
        type filter hook input priority 0;
        policy accept;
    }

    chain forward {
        type filter hook forward priority 0;
        policy drop;

        ct state invalid drop
        ct state established,related accept

        iifname "mgmt0" oifname "wan0" accept
        iifname "protected0" oifname "wan0" accept

        iifname "mgmt0" oifname "protected0" accept
        iifname "protected0" oifname "mgmt0" accept
    }

    chain output {
        type filter hook output priority 0;
        policy accept;
    }
}

table ip soc_nat {
    chain postrouting {
        type nat hook postrouting priority 100;
        policy accept;

        ip saddr 192.168.30.0/24 oifname "wan0" masquerade
        ip saddr 192.168.20.0/24 oifname "wan0" masquerade
    }
}